services:
  - type: web
    name: cva-backend
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python run.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: PYTHONPATH
        value: "/opt/render/project/src/src"
      - key: PORT
        value: "10000"
    healthCheckPath: /api/v1/health
