services:
  - type: web
    name: cva-backend
    runtime: python
    buildCommand: "cd backend && chmod +x build.sh && ./build.sh"
    startCommand: "cd backend && python run.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: PYTHONPATH
        value: "/opt/render/project/src/src"
      - key: PORT
        value: "10000"
      - key: CVA_LITE
        value: "1"
    healthCheckPath: /api/v1/health
